[project]
name = "resolve-autocut"
version = "0.1.0"
description = "AI-assisted video cleanup for DaVinci Resolve - local, open-source, Apple Silicon optimized"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Resolve AutoCut Team"}
]

# Core dependencies
dependencies = [
    # Scientific computing
    "numpy>=1.26.0",
    
    # UHM filler detection (ONNX runtime)
    "onnxruntime>=1.18.0",
    "huggingface-hub>=0.23.0",
    
    # MLX Whisper for Apple Silicon transcription
    "mlx>=0.12.0",
    "mlx-whisper>=0.4.0",
    
    # Optional: for audio processing (we primarily use ffmpeg via subprocess)
    "pydub>=0.25.1",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# No special config needed for now

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
